<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Окно администратора</title>
</head>
<body>

<h3>Сохранить нового клиента</h3>
<form id="myForm" class="grid-form" action="/user" method="post" accept-charset="UTF-8">

    <label for="clientName">Имя клиента:</label>
    <input type="text" id="clientName" name="clientName" placeholder="Введите имя пользователя">

    <label for="clientAddress">Адрес клиента:</label>
    <input type="text" id="clientAddress" name="clientAddress" placeholder="Введите адрес пользователя">

    <label for="clientPhone">Телефон клиента:</label>
    <input type="text" id="clientPhone" name="clientPhone" placeholder="Введите телефон пользователя">

    <div></div>
    <div class="actions">
        <button type="submit">Создать</button>
    </div>

    <pre id="userDataContainer"></pre>
</form>

<h3>Список клиентов</h3>
<table>
    <thead>
    <tr>
        <th >Имя</th>
        <th>Адрес</th>
        <th>Телефон</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="client : ${clients}">
        <td th:text="${client.name}">Alice</td>
        <td th:text="${client.address != null ? client.address.street : ''}">Main St.</td>
        <td>
            <ul style="list-style-type: none; padding-left: 0;">
                <li th:each="phone : ${client.phones}"
                    th:text="${phone.number}"></li>
            </ul>
        </td>
    </tr>
    </tbody>
</table>
</body>
<style>
    .grid-form {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      max-width: 400px;
    }

    .grid-form label {
      font-weight: 500;
    }

    body { font-family: sans-serif; margin: 24px; }
        form {
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 8px 12px;
            max-width: 520px;
        }
        form label { align-self: center; }
        table { border-collapse: collapse; width: 70%; }
        th, td { border: 1px solid #ddd; padding: 8px; }

</style>
</html>
